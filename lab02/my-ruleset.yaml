extends: spectral:oas
rules:
  info-contact: off
  info-description: off
  operation-tags: off
  openapi-tags: off
  
  # Bật các rule quan trọng
  openapi-tags: on
  path-keys-no-trailing-slash: on
  path-not-in-query: on
  path-params: on
  operation-operationId: off
  operation-summary: off
  
  # Custom rule kiểm tra có ít nhất 4 paths
  min-paths:
    description: API phải có ít nhất 4 paths
    recommended: true
    severity: warn
    given: $.paths
    then:
      function: length
      functionOptions:
        min: 4