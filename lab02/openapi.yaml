openapi: 3.1.0
info:
  title: Camera Stream Service API
  version: 1.0.0
  description: Service nhận dữ liệu từ camera và gọi AI Vision
  contact:
    name: Camera Stream Team

servers:
  - url: http://localhost:8000

tags:
  - name: Camera Management
  - name: Frame Management

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [Camera Management]
      responses:
        '200':
          description: OK

  /cameras:
    get:
      operationId: getCameras
      summary: Get all cameras
      tags: [Camera Management]
      responses:
        '200':
          description: List of cameras

  /cameras/{cameraId}:
    get:
      operationId: getCameraById
      summary: Get camera by ID
      tags: [Camera Management]
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Camera details
        '404':
          description: Not found

  /frames:
    post:
      operationId: uploadFrame
      summary: Upload frame
      tags: [Frame Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                camera_id:
                  type: string
                image_url:
                  type: string
                timestamp:
                  type: string
              required:
                - camera_id
                - image_url
                - timestamp
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad request

components:
  schemas: {}
