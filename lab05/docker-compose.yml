services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: camera-db-lab05
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 2. Worker (xử lý tác vụ nền)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: camera-worker-lab05
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - AI_VISION_URL=http://ai-vision-team:8000
    networks:
      - team-internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 3. Camera Stream API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera-api-lab05
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - AI_VISION_URL=http://ai-vision-team:8000
      - AUTH_TOKEN=${AUTH_TOKEN:-local-dev-token}
    ports:
      - "8001:8000"
    networks:
      - team-internal
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  team-internal:
    driver: bridge
    name: camera-team-internal

volumes:
  postgres_data:
    name: camera-postgres-data